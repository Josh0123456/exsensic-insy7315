# Continuous deployment to production: every push to main (a reviewed release merge) is tested
# and published, then waits for a second team member to approve before it deploys to the
# production web and API apps on Azure App Service and is smoke-tested.
name: cd-production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets azure/login exchange a short-lived GitHub token for Azure access (OIDC)
  issues: write # the approval gate opens an issue and reads the approver's reply

# Deployments queue up instead of cancelling each other halfway through.
concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # App names can be overridden with repository variables (Settings → Secrets and variables →
  # Actions → Variables) if the defaults were taken in Azure.
  WEB_APP_NAME: ${{ vars.PRODUCTION_WEB_APP_NAME || 'app-exsensic-web' }}
  API_APP_NAME: ${{ vars.PRODUCTION_API_APP_NAME || 'app-exsensic-api' }}
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP || 'rg-exsensic-insy7315' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Never deploy code whose unit tests fail.
      - name: Run unit tests
        run: dotnet test tests/Exsensic.UnitTests/Exsensic.UnitTests.csproj --configuration Release

      - name: Publish web app
        run: dotnet publish src/Exsensic.Web/Exsensic.Web.csproj --configuration Release --output publish/web

      - name: Publish API
        run: dotnet publish src/Exsensic.Api/Exsensic.Api.csproj --configuration Release --output publish/api

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: publish/web
          retention-days: 14

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: publish/api
          retention-days: 14

  deploy:
    needs: build
    # Switched on by the repository variable PRODUCTION_DEPLOY_ENABLED=true once the production
    # Azure resources exist. Until then the build still runs and deploy is skipped.
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Includes up to 60 minutes waiting for approval; an unanswered request fails the run.
    timeout-minutes: 80
    steps:
      # Approval gate. GitHub's built-in environment reviewers are not available on a free private
      # repository, so the job opens an issue and waits until someone in PRODUCTION_APPROVERS
      # comments "approve" (or "deny"). The person who started the run cannot approve it.
      - name: Wait for production approval
        uses: trstringer/manual-approval@v1
        timeout-minutes: 60
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ vars.PRODUCTION_APPROVERS }}
          minimum-approvals: 1
          exclude-workflow-initiator-as-approver: true
          issue-title: "Approve production deployment of ${{ github.sha }}"
          issue-body: "Staging must be green for this commit. Comment 'approve' to deploy to production or 'deny' to stop."

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web
          path: web

      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api
          path: api

      # OIDC login: Azure trusts this repository's main branch through a federated credential
      # on the deploy identity, so no Azure password or key is stored in GitHub.
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The API goes first so the new web app never calls an older API.
      - name: Deploy API to production
        id: deploy-api
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.API_APP_NAME }}
          package: api
          startup-command: dotnet Exsensic.Api.dll

      - name: Deploy web app to production
        id: deploy-web
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEB_APP_NAME }}
          package: web
          startup-command: dotnet Exsensic.Web.dll

      # The apps restart after a deployment, so allow up to about 5 minutes for them to answer.
      # /health/ready on the API also proves it can reach its database (step 10).
      # The API only accepts traffic from its web app's outbound IPs (step 14, docs/operations.md).
      # Let this runner in just long enough to smoke-test the API, then remove the rule.
      - name: Allow this runner through the API access restriction
        run: |
          runner_ip=$(curl --silent --fail https://api.ipify.org)
          az webapp config access-restriction add --resource-group "$RESOURCE_GROUP" --name "$API_APP_NAME"             --rule-name github-smoke-test --action Allow --ip-address "$runner_ip/32" --priority 50 --output none
          sleep 20

      - name: Smoke test production
        env:
          API_URL: ${{ steps.deploy-api.outputs.webapp-url }}
          WEB_URL: ${{ steps.deploy-web.outputs.webapp-url }}
        run: |
          check() {
            for attempt in $(seq 1 20); do
              status=$(curl --silent --location --output /dev/null --write-out "%{http_code}" --max-time 30 "$1" || true)
              if [ "$status" = "200" ]; then
                echo "OK  $1"
                return 0
              fi
              echo "Waiting for $1 (attempt $attempt, status $status)"
              sleep 15
            done
            echo "::error::$1 did not return 200 after deployment."
            return 1
          }
          check "$API_URL/health"
          check "$API_URL/health/ready"
          check "$WEB_URL/health"
          check "$WEB_URL/"

      - name: Remove the runner from the API access restriction
        if: always()
        run: >
          az webapp config access-restriction remove --resource-group "$RESOURCE_GROUP"
          --name "$API_APP_NAME" --rule-name github-smoke-test --output none || true

      - name: Write deployment summary
        if: always()
        run: |
          {
            echo "### Production deployment"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- API: ${{ steps.deploy-api.outputs.webapp-url }}"
            echo "- Web: ${{ steps.deploy-web.outputs.webapp-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
