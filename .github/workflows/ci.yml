# Continuous integration: every push and pull request is built, tested and checked for
# vulnerable packages and leaked secrets. A red run blocks the merge (branch protection).
name: ci

on:
  push:
    branches:
      - develop
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "docs/**"
      - "test/**"
      - "ci/**"
      - "release/**"
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read
  pull-requests: read # lets the secret scan list a pull request's commits

# A newer push to the same branch or PR cancels the older, now pointless, run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          # Full history so the secret scan checks every commit, not just the latest.
          fetch-depth: 0

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # NuGet audit runs during restore; with warnings as errors, a known-vulnerable
      # package fails the build here.
      - name: Restore packages
        run: dotnet restore Exsensic.sln

      - name: Build (Release)
        run: dotnet build Exsensic.sln --configuration Release --no-restore

      # SQL Server for the integration tests (ConnectionStrings:Tests, docs/CONTRACTS.md §9).
      # The password is generated for this run only and masked in the logs, so no secret
      # is ever stored in the repository.
      - name: Start SQL Server for integration tests
        run: |
          password="$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 24)Aa1!"
          echo "::add-mask::$password"
          docker run --detach --name sqlserver \
            --env ACCEPT_EULA=Y --env "MSSQL_SA_PASSWORD=$password" \
            --publish 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for attempt in $(seq 1 30); do
            if docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd -C -S localhost \
                 -U sa -P "$password" -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is ready."
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "SQL Server did not start in time." && docker logs sqlserver && exit 1
            fi
            sleep 2
          done
          echo "ConnectionStrings__Tests=Server=localhost,1433;Database=ExsensicTests;User Id=sa;Password=$password;TrustServerCertificate=True" >> "$GITHUB_ENV"

      # E2E tests are not run here: they need a deployed site and run after the
      # staging deployment instead (cd-staging.yml).
      - name: Run unit tests
        run: >
          dotnet test tests/Exsensic.UnitTests/Exsensic.UnitTests.csproj
          --configuration Release --no-build
          --logger trx --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Run integration tests
        run: >
          dotnet test tests/Exsensic.IntegrationTests/Exsensic.IntegrationTests.csproj
          --configuration Release --no-build
          --logger trx --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 14

      # Explicit, readable report of vulnerable packages (direct and transitive).
      - name: Check for vulnerable packages
        run: |
          dotnet list Exsensic.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found. Update them before merging."
            exit 1
          fi

      # The repository is private without GitHub push protection, so CI scans the whole
      # history for committed passwords, keys and connection strings instead.
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Report in the job log and summary only; commenting on PRs needs write access.
          GITLEAKS_ENABLE_COMMENTS: false
